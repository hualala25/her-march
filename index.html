<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170b0e" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="《她的行军》：以长征路线为轴的交互式三维叙事地图。八件遗物，八个坐标，重看长征中的女红军。"
    />
    <title>她的行军 · 长征路上的女红军</title>
    <style>
      :root {
        color-scheme: dark;
        background: #170b0e;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #170b0e;
        color: #e8d4ae;
        font-family: "Songti SC", "Noto Serif CJK SC", serif;
      }

      .loader {
        display: grid;
        gap: 12px;
        text-align: center;
      }

      .loader strong {
        color: #f4dfb7;
        font-size: clamp(28px, 7vw, 54px);
        font-weight: 400;
        letter-spacing: 0.12em;
      }

      .loader span {
        color: #b89b74;
        font-size: 13px;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div class="loader" role="status" aria-live="polite">
      <strong>她的行军</strong>
      <span id="loadingStatus">正在载入作品</span>
    </div>
    <noscript>请启用 JavaScript 后重新打开本页。</noscript>
    <script>
      (async function loadHerMarch() {
        const loadingStatus = document.getElementById("loadingStatus");

        if (window.location.protocol === "file:") {
          window.location.replace("./page.html");
          return;
        }

        async function readSource(path) {
          const response = await fetch(path, { cache: "no-store" });
          if (!response.ok) throw new Error(`无法载入 ${path}: ${response.status}`);

          let bytes = new Uint8Array(await response.arrayBuffer());
          const isGzip = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;

          if (isGzip) {
            if (!("DecompressionStream" in window)) {
              throw new Error("浏览器不支持 DecompressionStream");
            }
            const stream = new Blob([bytes])
              .stream()
              .pipeThrough(new DecompressionStream("gzip"));
            bytes = new Uint8Array(await new Response(stream).arrayBuffer());
          }

          return new TextDecoder().decode(bytes);
        }

        try {
          let html;
          try {
            html = await readSource("./page.html.gz");
          } catch (compressedError) {
            console.warn("压缩正文载入失败，切换到兼容版本。", compressedError);
            loadingStatus.textContent = "正在载入兼容版本";
            html = await readSource("./page.html");
          }

          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          loadingStatus.textContent = "作品载入失败，请刷新重试";
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
