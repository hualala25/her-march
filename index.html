<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170b0e" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="《她的行军》：以长征路线为轴的交互式三维叙事地图。八件遗物，八个坐标，重看长征中的女红军。"
    />
    <title>她的行军 · 长征路上的女红军</title>
    <style>
      :root {
        color-scheme: dark;
        background: #170b0e;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #170b0e;
        color: #e8d4ae;
        font-family: "Songti SC", "Noto Serif CJK SC", serif;
      }

      .loader {
        display: grid;
        gap: 12px;
        text-align: center;
      }

      .loader strong {
        color: #f4dfb7;
        font-size: clamp(28px, 7vw, 54px);
        font-weight: 400;
        letter-spacing: 0.12em;
      }

      .loader span {
        color: #b89b74;
        font-size: 13px;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div class="loader" role="status" aria-live="polite">
      <strong>她的行军</strong>
      <span id="loadingStatus">正在载入作品</span>
    </div>
    <noscript>请启用 JavaScript 后重新打开本页。</noscript>
    <script>
      (async function loadHerMarch() {
        const loadingStatus = document.getElementById("loadingStatus");

        if (window.location.protocol === "file:") {
          window.location.replace("./page.html");
          return;
        }

        try {
          const response = await fetch("./page.html", { cache: "no-store" });
          if (!response.ok) throw new Error(`无法载入正文: ${response.status}`);
          const html = await response.text();

          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          loadingStatus.textContent = "作品载入失败，请刷新重试";
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
